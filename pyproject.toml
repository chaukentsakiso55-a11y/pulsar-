[project]
name = "pulsar-ai"
version = "1.0.0"
description = "Pulsar AI v1: Pulsar Max orchestration engine, API platform and native Pulsar-1 model"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.48,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.13,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
model = ["torch>=2.10"]
dev = ["pytest>=8"]

[project.scripts]
pulsar = "pulsar.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["."]
include = ["pulsar*", "model*"]
exclude = ["data*", "configs*", "checkpoints*", "scripts*", "tests*"]
namespaces = false

[tool.setuptools.package-data]
pulsar = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
